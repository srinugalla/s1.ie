apiVersion: apps/v1
kind: Deployment
metadata:
  name: s1ie-exams
  namespace: s1ie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s1ie-exams
  template:
    metadata:
      labels:
        app: s1ie-exams
    spec:
      containers:
        - name: s1ie
          image: srinugalla/s1ie-exams:local
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
